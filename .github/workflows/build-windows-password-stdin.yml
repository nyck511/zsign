name: Build Windows Password Stdin

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: >-
          msbuild build\windows\vs2022\zsign.sln
          /p:Configuration=Release
          /p:Platform=x64
          /p:ExtraDefines="ZSIGN_VERSION=1.1.1-stdin"
          /m

      - name: Smoke test
        shell: pwsh
        run: |
          $binary = '.\build\windows\vs2022\x64\Release\zsign.exe'
          $binaryText = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($binary))
          if (-not $binaryText.Contains('password-stdin')) {
            throw 'The password-stdin option is missing from the build.'
          }
          & $binary -v

      - uses: actions/upload-artifact@v4
        with:
          name: zsign-windows-x64-password-stdin
          path: build/windows/vs2022/x64/Release/zsign.exe
          if-no-files-found: error
